[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bufferlab"
version = "0.1.0"
description = "Terminal-native laboratory for simulating and comparing network queue-management algorithms"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "matplotlib>=3.8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
bufferlab = "bufferlab.cli:main"

[tool.setuptools.packages.find]
include = ["bufferlab*"]

[tool.setuptools.package-data]
"bufferlab.tui.styles" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: longer-running simulation tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
