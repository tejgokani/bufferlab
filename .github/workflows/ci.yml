name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: First run builds .venv, second run reuses it (POSIX)
        if: runner.os != 'Windows'
        run: |
          bin/bufferlab --version
          bin/bufferlab scenarios | head -3
          (mkdir -p /tmp/shadow/bufferlab && cd /tmp/shadow && "$GITHUB_WORKSPACE/bin/bufferlab" --version)
          test -x .venv/bin/python
      - name: First run builds .venv, second run reuses it (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          bin\bufferlab.cmd --version
          bin\bufferlab.cmd scenarios
